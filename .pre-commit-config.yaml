# pre-commit hooks — pdcs-core-tf-modules
#
# Install once:  pip install pre-commit && pre-commit install
# Run manually:  pre-commit run --all-files
#
# Local hooks (tofu, terragrunt, gitleaks) expect the tools on PATH: they
# are the same commands as the CI (see .github/workflows/ and the Makefile).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [-x]

  - repo: local
    hooks:
      - id: tofu-fmt
        name: tofu fmt -check (modules + examples)
        entry: tofu fmt -check -recursive 01-foundation 02-networking 03-compute modules examples
        language: system
        files: \.tf$
        pass_filenames: false

      - id: terragrunt-hcl-fmt
        name: terragrunt hcl fmt --check (root + reference client)
        entry: bash -c 'terragrunt hcl fmt --check . && terragrunt hcl fmt --check examples/terragrunt-client'
        language: system
        files: \.hcl$
        pass_filenames: false

      - id: gitleaks
        name: gitleaks (full history, default rules)
        entry: gitleaks detect --source . --redact --no-banner
        language: system
        pass_filenames: false
        always_run: true
