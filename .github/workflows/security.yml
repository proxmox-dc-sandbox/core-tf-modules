# security — secret scanning (gitleaks) + shell lint (ShellCheck).
#
# The repository history is clean under the default gitleaks rules
# (verified 2026-11-03); no project configuration file is needed. The three
# shell scripts at the root pass ShellCheck as-is.
name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  SHELLCHECK_VERSION: "0.11.0"

jobs:
  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # scan the whole history, not just the diff
      - name: Install gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" gitleaks
          "$HOME/.local/bin/gitleaks" version
      - name: gitleaks detect (full history, default rules)
        run: |
          "$HOME/.local/bin/gitleaks" detect \
            --source . --verbose --redact --no-banner

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C "$HOME/.local/bin" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          "$HOME/.local/bin/shellcheck" --version | head -2
      - name: shellcheck (wrappers + entrypoint)
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' f; do
            echo "::group::shellcheck $f"
            "$HOME/.local/bin/shellcheck" -x "$f" || status=1
            echo "::endgroup::"
          done < <(find . -name "*.sh" -type f -not -path "./.git/*" -print0)
          exit "$status"
