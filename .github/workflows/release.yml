# release — build and push the runner image (OpenTofu + Terragrunt) to ghcr.io.
#
# Triggered by version tags (v*) and manually. The image name is derived from
# the repository (ghcr.io/<owner>/<repo>) and must be all lowercase.
#
# Authentication uses the built-in GITHUB_TOKEN (scope packages:write is
# declared below) — no personal access token or manual secret is involved.
#
# NOTE(publication): pin the actions by commit SHA before the repository
# goes public (Dependabot can then keep them current).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Keep in sync with docker/Dockerfile defaults (also the same values the
  # validate workflow pins).
  TOFU_VERSION: "1.12.5"
  TERRAGRUNT_VERSION: "1.2.1"

jobs:
  docker:
    name: Build and push the tools image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Context is the repository root: docker/Dockerfile references
          # docker/entrypoint.sh relative to the context (same as the
          # documented local build: docker build -f docker/Dockerfile ... .).
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            TOFU_VERSION=${{ env.TOFU_VERSION }}
            TERRAGRUNT_VERSION=${{ env.TERRAGRUNT_VERSION }}
